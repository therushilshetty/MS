<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StaticsMaster · Wheelbarrow Solver</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--surface:#0d1117;--surface2:#111827;--surface3:#162033;
  --border:rgba(56,189,248,.13);--divider:rgba(56,189,248,.07);
  --text:#e2eeff;--muted:#8ba3c9;--faint:#4a607e;
  --cyan:#38bdf8;--cyan-glow:rgba(56,189,248,.18);
  --violet:#a78bfa;--violet-glow:rgba(167,139,250,.15);
  --orange:#fb923c;--orange-glow:rgba(251,146,60,.15);
  --green:#34d399;--green-glow:rgba(52,211,153,.14);
  --rose:#fb7185;--rose-glow:rgba(251,113,133,.13);
  --yellow:#fbbf24;--yellow-glow:rgba(251,191,36,.13);
  --grid-line:rgba(56,189,248,.04);
  --font:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;
  --r-sm:8px;--r-md:14px;--r-lg:20px;
}

[data-theme="light"]{
  --bg:#f0f4fa;--surface:#fff;--surface2:#f5f9ff;--surface3:#eaf2ff;
  --border:rgba(14,80,180,.10);--divider:rgba(14,80,180,.06);
  --text:#0f172a;--muted:#4b6b96;--faint:#94a3b8;
  --cyan:#0284c7;--cyan-glow:rgba(2,132,199,.10);
  --violet:#7c3aed;--violet-glow:rgba(124,58,237,.10);
  --orange:#ea580c;--orange-glow:rgba(234,88,12,.10);
  --green:#059669;--green-glow:rgba(5,150,105,.10);
  --rose:#e11d48;--rose-glow:rgba(225,29,72,.10);
  --yellow:#d97706;--yellow-glow:rgba(217,119,6,.10);
  --grid-line:rgba(14,80,180,.04);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:40px 40px;
}
input, button{font-family:inherit;color:inherit;outline:none;border:none;background:none;}

.hdr{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:56px;background:rgba(13,17,23,0.85);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;}
.brand-name{font-size:15px;font-weight:700;}
.brand-sub{font-size:10px;color:var(--muted);font-family:var(--mono);}

.layout{display:grid;grid-template-columns:355px 1fr;min-height:calc(100vh - 56px)}
.sidebar{padding:16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.main-col{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.iw input{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.solve-btn{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:white;font-weight:700;margin-top:10px;cursor:pointer}
.errmsg{display:none;font-size:11px;color:var(--rose);background:rgba(251,113,133,0.1);border:1px solid var(--rose);padding:8px;border-radius:8px;margin-top:10px;}

.canvas-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;position:relative}
.fbd-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.tab{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.canvas-zone{padding:20px;display:flex;justify-content:center;background:radial-gradient(circle at center, var(--surface3), var(--bg));}
canvas{border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}

.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;text-align:center}
.ck{font-size:9px;font-weight:700;color:var(--faint);margin-bottom:4px}
.cv{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--cyan)}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <div class="logo">SM</div>
    <div>
      <div class="brand-name">StaticsMaster</div>
      <div class="brand-sub">WHEELBARROW SOLVER</div>
    </div>
  </div>
  <div class="pill">ΣM = 0</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="card">
      <div class="field">
        <label>Handle height (h)</label>
        <div class="iw"><input id="inp_h" value="650"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>A→G horizontal (AG)</label>
          <div class="iw"><input id="inp_ag" value="925"></div>
        </div>
        <div class="field">
          <label>G→B horizontal (GB)</label>
          <div class="iw"><input id="inp_gb" value="200"></div>
        </div>
      </div>
      <div class="field">
        <label>Mass (kg)</label>
        <div class="iw"><input id="inp_mass" value="100"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Bar Angle (β°)</label>
          <div class="iw"><input id="inp_beta" value="25"></div>
        </div>
        <div class="field">
          <label>Force Angle (α° from bar)</label>
          <div class="iw"><input id="inp_alpha" value="90"></div>
        </div>
      </div>
      <button class="solve-btn" id="solveBtn">SOLVE & ANIMATE</button>
      <div class="errmsg" id="errMsg"></div>
    </div>

    <div class="card">
      <div class="ck" style="margin-bottom:8px">RESULTS</div>
      <div class="rg">
        <div class="chip"><div class="ck">FORCE F</div><div class="cv" id="res_F">-</div><div class="ck">N</div></div>
        <div class="chip"><div class="ck">REACTION B</div><div class="cv" id="res_B">-</div><div class="ck">N</div></div>
      </div>
    </div>
  </aside>

  <main class="main-col">
    <div class="canvas-card">
      <div class="fbd-header">
        <div class="tabs">
          <div class="tab active" data-tab="fbd">FBD</div>
          <div class="tab" data-tab="geom">GEOMETRY</div>
        </div>
      </div>
      <div class="canvas-zone">
        <canvas id="mainCanvas" width="800" height="500"></canvas>
      </div>
    </div>
  </main>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
let currentTab = 'fbd';

function getInputs() {
  return {
    h: parseFloat(document.getElementById('inp_h').value),
    ag: parseFloat(document.getElementById('inp_ag').value),
    gb: parseFloat(document.getElementById('inp_gb').value),
    m: parseFloat(document.getElementById('inp_mass').value),
    beta: parseFloat(document.getElementById('inp_beta').value) * Math.PI / 180,
    alpha: parseFloat(document.getElementById('inp_alpha').value) * Math.PI / 180
  };
}

function solve() {
  const p = getInputs();
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  if (p.h < 0 || p.ag < 0 || p.gb < 0 || p.m < 0) {
    err.textContent = "Warning: Lengths and mass should not be negative.";
    err.style.display = 'block';
  }

  const W = p.m * 9.81;
  const L = p.ag + p.gb;
  const momentW = W * p.gb;
  const F = momentW / (L * Math.sin(p.alpha));
  
  document.getElementById('res_F').textContent = F.toFixed(1);
  document.getElementById('res_B').textContent = (W - F * Math.sin(p.beta + p.alpha)).toFixed(1);
  
  draw(p, F);
}

function draw(p, FVal) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const scale = 0.3;
  const offX = 550, offY = 350;
  const L = (p.ag + p.gb) * scale;
  const dG = p.gb * scale;
  
  const B = { x: offX, y: offY };
  const A = { x: B.x - L * Math.cos(p.beta), y: B.y - L * Math.sin(p.beta) };
  const G = { x: B.x - dG * Math.cos(p.beta), y: B.y - dG * Math.sin(p.beta) };

  ctx.strokeStyle = '#4a607e';
  ctx.beginPath(); ctx.moveTo(100, offY + 20); ctx.lineTo(700, offY + 20); ctx.stroke();

  ctx.lineWidth = 6; ctx.strokeStyle = '#38bdf8';
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();

  // Labels for FBD (GB and h)
  ctx.lineWidth = 1; ctx.strokeStyle = '#a78bfa'; ctx.fillStyle = '#a78bfa';
  ctx.font = '11px Space Mono';
  
  // Horizontal distance GB
  ctx.beginPath();
  ctx.moveTo(G.x, G.y + 20); ctx.lineTo(B.x, B.y + 20);
  ctx.stroke();
  ctx.fillText(`GB: ${p.gb}mm`, (G.x + B.x)/2 - 25, G.y + 35);

  // Vertical distance h
  ctx.beginPath();
  ctx.moveTo(A.x - 20, A.y); ctx.lineTo(A.x - 20, B.y);
  ctx.stroke();
  ctx.fillText(`h: ${p.h}mm`, A.x - 65, (A.y + B.y)/2);

  const forceAngle = p.beta + p.alpha;
  const fLen = 60;
  ctx.strokeStyle = '#34d399'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(A.x - fLen * Math.cos(forceAngle), A.y - fLen * Math.sin(forceAngle));
  ctx.stroke();
  ctx.fillStyle = '#34d399'; ctx.fillText('F', A.x - fLen * Math.cos(forceAngle) - 10, A.y - fLen * Math.sin(forceAngle) - 5);

  ctx.strokeStyle = '#fb7185'; ctx.beginPath();
  ctx.moveTo(G.x, G.y); ctx.lineTo(G.x, G.y + 50); ctx.stroke();
  ctx.fillStyle = '#fb7185'; ctx.fillText('W', G.x + 5, G.y + 45);

  ctx.strokeStyle = '#fbbf24'; ctx.beginPath();
  ctx.moveTo(B.x, B.y); ctx.lineTo(B.x, B.y - 40); ctx.stroke();
  ctx.fillStyle = '#fbbf24'; ctx.fillText('B_y', B.x + 5, B.y - 35);
}

document.getElementById('solveBtn').addEventListener('click', solve);
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelector('.tab.active').classList.remove('active');
    t.classList.add('active');
    currentTab = t.dataset.tab;
    solve();
  });
});

solve();
</script>
</body>
</html>
